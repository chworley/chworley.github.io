<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Random Pair Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 20px auto;
    padding: 20px;
}

textarea {
    width: 100%;
    min-height: 200px;
}

button {
    padding: 10px 20px;
    margin: 5px 5px 5px 0;
    cursor: pointer;
}

.pair {
    padding: 8px;
    margin: 4px 0;
    background: #f3f3f3;
    border-radius: 6px;
}

.round {
    margin-top: 20px;
    border-top: 2px solid #ddd;
    padding-top: 10px;
}

small {
    color: #555;
}
</style>
</head>
<body>

<h1>Smart Random Pair Generator</h1>

<p>Enter one name per line.</p>

<textarea id="names"></textarea><br>

<button onclick="start()">Start New Session</button>
<button onclick="generateRound()">Generate Next Round</button>
<button onclick="resetHistory()">Reset Pair History</button>

<div id="output"></div>

<script>
let participants = [];
let pairHistory = {};
let roundNumber = 0;

function pairKey(a,b){
    return [a,b].sort().join("||");
}

function shuffle(arr){
    let copy = [...arr];

    for(let i = copy.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function countPair(a,b){
    return pairHistory[pairKey(a,b)] || 0;
}

function savePair(a,b){
    const key = pairKey(a,b);
    pairHistory[key] = (pairHistory[key] || 0) + 1;
}

function scorePairing(pairing){
    let score = 0;

    for(const [a,b] of pairing){
        score += countPair(a,b);
    }

    return score;
}

function generateBestPairing(names){

    let best = null;
    let bestScore = Infinity;

    // Try lots of random configurations and
    // keep the one that minimizes repeated pairings.
    for(let attempt = 0; attempt < 3000; attempt++){

        let working = shuffle(names);
        let pairing = [];

        while(working.length >= 2){
            pairing.push([
                working.pop(),
                working.pop()
            ]);
        }

        if(working.length === 1){
            pairing.push([
                working.pop(),
                "(solo)"
            ]);
        }

        let score = scorePairing(pairing);

        if(score < bestScore){
            bestScore = score;
            best = pairing;
        }
    }

    return best;
}

function start(){
    participants = document.getElementById("names")
        .value
        .split("\n")
        .map(x => x.trim())
        .filter(x => x);

    roundNumber = 0;
    pairHistory = {};

    document.getElementById("output").innerHTML = "";

    if(participants.length < 2){
        alert("Need at least two names.");
        return;
    }

    generateRound();
}

function generateRound(){

    if(participants.length < 2){
        alert("Start a session first.");
        return;
    }

    roundNumber++;

    const pairing = generateBestPairing(participants);

    pairing.forEach(([a,b])=>{
        if(b !== "(solo)"){
            savePair(a,b);
        }
    });

    const div = document.createElement("div");
    div.className = "round";

    let html = `<h2>Round ${roundNumber}</h2>`;

    pairing.forEach(([a,b])=>{
        if(b === "(solo)"){
            html += `<div class="pair">${a} (solo)</div>`;
        } else {
            html += `<div class="pair">${a} &amp; ${b}</div>`;
        }
    });

    div.innerHTML = html;

    document.getElementById("output")
        .prepend(div);
}

function resetHistory(){
    pairHistory = {};
    roundNumber = 0;
    document.getElementById("output").innerHTML = "";
}
</script>

</body>
</html>
