<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Pair Cycler</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 20px auto;
    padding: 20px;
}

textarea {
    width: 100%;
    min-height: 200px;
}

button {
    padding: 10px 20px;
    margin: 5px 5px 5px 0;
    cursor: pointer;
}

.pair {
    padding: 8px;
    margin: 4px 0;
    background: #f3f3f3;
    border-radius: 6px;
}

.question {
    padding: 12px;
    margin: 10px 0;
    background: #dff0ff;
    border-left: 5px solid #4a90e2;
    border-radius: 6px;
    font-weight: bold;
    font-size: 1.1em;
}

.round {
    margin-top: 20px;
    border-top: 2px solid #ddd;
    padding-top: 10px;
}

small {
    color: #555;
}
</style>
</head>

<body>

<h1>Random Pair Cycler</h1>
<p>Enter one name per line.</p>

<textarea id="names"></textarea><br>

<button onclick="start()">Start New Session</button>
<button onclick="generateRound()">Generate Next Round</button>
<button onclick="newQuestionOnly()">New Question Only</button>
<button onclick="resetHistory()">Reset Pair History</button>

<div id="output"></div>

<script>

let participants = [];
let pairHistory = {};
let roundNumber = 0;
let usedQuestions = [];

/*
 * EDIT QUESTIONS HERE
 */
const icebreakerQuestions = [
    "What is something you know more about than most people?",
    "What is something you learned recently that you probably should have known sooner?",
    "What is your favorite snack?",
    "What is the best movie you've seen recently?",
    "What is a hobby you would like to try someday?",
    "What is your dream vacation destination?",
    "What is your favorite season and why?",
    "What is a food everyone seems to like but you don't?",
    "What was your favorite subject in middle school?",
    "What is something you're looking forward to this year?",
    "What is a small thing that always makes your day better?",
    "What is the most interesting place you've ever visited?",
    "Do you prefer the beach, mountains, or city?",
    "What is your go-to fast food order?",
    "What is something you're excited about right now?",
    "What is your favorite animal?",
    "If your backpack could magically contain one unlimited item, what would you choose?",
    "If you had to replace your hands with kitchen utensils, which two would you choose?",
    "If every time you sneezed you teleported somewhere random, would that be awesome or terrible?",
    "If you met a talking squirrel, what would you ask it?",
    "If you could make one object talk, what would it be and what would it complain about?"
];

function getRandomQuestion() {

    if (usedQuestions.length >= icebreakerQuestions.length) {
        usedQuestions = [];
    }

    const available = icebreakerQuestions.filter(
        q => !usedQuestions.includes(q)
    );

    const question =
        available[Math.floor(Math.random() * available.length)];

    usedQuestions.push(question);

    return question;
}

function pairKey(a, b) {
    return [a, b].sort().join("||");
}

function shuffle(arr) {
    let copy = [...arr];

    for (let i = copy.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function countPair(a, b) {
    return pairHistory[pairKey(a, b)] || 0;
}

function savePair(a, b) {
    const key = pairKey(a, b);
    pairHistory[key] = (pairHistory[key] || 0) + 1;
}

function scorePairing(pairing) {
    let score = 0;

    for (const [a, b] of pairing) {
        score += countPair(a, b);
    }

    return score;
}

function generateBestPairing(names) {

    let best = null;
    let bestScore = Infinity;

    for (let attempt = 0; attempt < 3000; attempt++) {

        let working = shuffle(names);
        let pairing = [];

        while (working.length >= 2) {
            pairing.push([
                working.pop(),
                working.pop()
            ]);
        }

        if (working.length === 1) {
            pairing.push([
                working.pop(),
                "(solo)"
            ]);
        }

        let score = scorePairing(pairing);

        if (score < bestScore) {
            bestScore = score;
            best = pairing;
        }
    }

    return best;
}

function start() {

    participants = document.getElementById("names")
        .value
        .split("\n")
        .map(x => x.trim())
        .filter(x => x);

    roundNumber = 0;
    pairHistory = {};
    usedQuestions = [];

    document.getElementById("output").innerHTML = "";

    if (participants.length < 2) {
        alert("Need at least two names.");
        return;
    }

    generateRound();
}

function generateRound() {

    if (participants.length < 2) {
        alert("Start a session first.");
        return;
    }

    roundNumber++;

    const question = getRandomQuestion();
    const pairing = generateBestPairing(participants);

    pairing.forEach(([a, b]) => {
        if (b !== "(solo)") {
            savePair(a, b);
        }
    });

    const div = document.createElement("div");
    div.className = "round";

    let html = `
        <h2>Round ${roundNumber}</h2>

        <div id="currentQuestion" class="question">
            Icebreaker: ${question}
        </div>
    `;

    pairing.forEach(([a, b]) => {

        if (b === "(solo)") {
            html += `<div class="pair">${a} (solo)</div>`;
        } else {
            html += `<div class="pair">${a} &amp; ${b}</div>`;
        }

    });

    div.innerHTML = html;

    document.getElementById("output").prepend(div);
}

function newQuestionOnly() {

    if (participants.length < 2) {
        alert("Start a session first.");
        return;
    }

    const question = getRandomQuestion();

    const questionBox = document.getElementById("currentQuestion");

    if (questionBox) {
        questionBox.textContent = `Icebreaker: ${question}`;
    }
}

function resetHistory() {

    pairHistory = {};
    roundNumber = 0;
    usedQuestions = [];

    document.getElementById("output").innerHTML = "";
}

</script>

</body>
</html>
